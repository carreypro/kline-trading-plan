name: test

on:
  push:
  pull_request:

jobs:
  calculators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/*.py
